#cloud-config
# Staging host bootstrap (tools/staging/README.md), Ubuntu 24.04 with a public IPv4 at first boot.
# Paste as the VM's cloud-init user data. Installs Docker, curl, jq and deploy.sh. Open TCP 443, 3333, 3334, 10207 in the
# provider's firewall; the host's iptables INPUT chain doesn't apply, since Docker forwards published ports itself.
# No secrets here: the admin password is generated on the host by rv2-staging-setup (run once after DNS works).
package_update: true
packages: [docker.io, docker-compose-v2, curl, jq]
runcmd:
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  - mkdir -p /opt/rv2-staging
  - install -d -o ubuntu -m 700 /var/lib/rv2-staging
  - curl -fsSL https://raw.githubusercontent.com/Hub-Tansky/RoboViolence2/main/tools/staging/deploy.sh -o /opt/rv2-staging/deploy.sh
  - chmod 755 /opt/rv2-staging/deploy.sh
write_files:
  - path: /usr/local/bin/rv2-staging-setup
    permissions: "0755"
    content: |
      #!/bin/bash
      # Usage: sudo rv2-staging-setup <public name> [ntfy topic]   (run once DNS points at this host)
      set -euo pipefail
      [ -n "${1:-}" ] || { echo "usage: sudo rv2-staging-setup <public name> [ntfy topic]"; exit 1; }
      env=/etc/rv2-staging.env
      if [ ! -f "$env" ]; then
        umask 077
        printf 'BV2_ADMIN_PASS=%s\nBV2_ADMIN_HOST=%s\nBV2_ADMIN_PORT=443\nBV2_PUBLIC_ADDRESS=%s\nNTFY_TOPIC=%s\n' \
          "$(openssl rand -hex 16)" "$1" "$(curl -fsS https://ifconfig.me)" "${2:-}" > "$env"
        chown ubuntu "$env"; chmod 600 "$env"
      else
        echo "$env exists and is kept; edit it by hand to change the name or topic"
      fi
      echo '*/10 * * * * /opt/rv2-staging/deploy.sh >>/var/lib/rv2-staging/deploy.log 2>&1' | crontab -u ubuntu -
      echo "Env file: $env. First deploy now (this takes a few minutes):"
      sudo -u ubuntu /opt/rv2-staging/deploy.sh
