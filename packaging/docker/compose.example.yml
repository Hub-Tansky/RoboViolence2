# A master, a game server and a TLS proxy for its admin API on one host (built for the host: amd64 or arm64). Placeholder values only: real secrets come from an env file
# outside the repository (docs/ops/runbook.md). Start from the repository root:
#   docker compose -f packaging/docker/compose.example.yml --env-file ~/bv2-secrets.env up -d
name: roboviolence2
x-common: &common
  init: true # forwards stop signals: the servers install no handlers of their own
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
services:
  master:
    <<: *common
    image: ghcr.io/hub-tansky/roboviolence2-master:latest
    build: { context: ../.., dockerfile: packaging/docker/Dockerfile, target: master }
    ports: ["10207:10207/tcp"]
    volumes: ["master-data:/var/lib/bv2"]
  server:
    <<: *common
    image: ghcr.io/hub-tansky/roboviolence2-server:latest
    build: { context: ../.., dockerfile: packaging/docker/Dockerfile, target: server }
    depends_on: { master: { condition: service_healthy } }
    environment:
      BV2_MASTER_SERVERS: "master:10207"
      BV2_SV_PASSWORD: "${BV2_SV_PASSWORD:-}" # empty: no join password
      BV2_ADMIN_PASS: "${BV2_ADMIN_PASS:-}"   # empty: no admin login, and the admin API refuses everything
      BV2_ADMIN_API_PORT: "8080"              # the admin API, on the compose network only: never publish it
      BV2_ADMIN_API_BIND: "0.0.0.0"
      BV2_ADMIN_API_PROXY: "admin-proxy"      # only its X-Forwarded-For is believed
    ports: ["3333:3333/tcp"]
    volumes: ["server-data:/var/lib/bv2"]
    stdin_open: true # `docker attach` reaches the server console
    tty: true        # and Ctrl-P Ctrl-Q detaches
  admin-proxy:
    <<: *common
    image: caddy:2.11.7
    depends_on: { server: { condition: service_healthy } }
    environment:
      BV2_ADMIN_HOST: "${BV2_ADMIN_HOST:-localhost}"
    ports: ["8443:443/tcp"] # the admin API over TLS (docs/ops/runbook.md)
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
volumes:
  master-data: {}
  server-data: {}
  caddy-data: {}
