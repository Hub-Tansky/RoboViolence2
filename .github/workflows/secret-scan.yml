name: secret-scan
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan commits after the fork point
        run: gitleaks git --config .gitleaks.toml --redact --log-opts="$(cat tools/FORK_BASE)..HEAD"
      - name: Original assets must not return
        run: python3 tools/check-original-assets.py
