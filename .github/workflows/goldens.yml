name: goldens
# By hand, on the branch to change (`gh workflow run goldens.yml --ref <branch>`): regenerate the screenshot goldens
# (tests/golden/*.png, ADR 0026) in the configuration of the CI job that checks them (`smoke`, linux-x64-asan under
# Xvfb) and show before, after and diff images in the run summary (ROBO-254, ADR ROBO-254). The new PNGs are the
# artifact `goldens`; commit them to the branch yourself, so CI runs on them. Running on the branch's own ref keeps any
# cache this run saves in that branch's scope, never main's. The job that runs the branch's code has a read-only
# token; the job that publishes the preview images builds nothing.
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Golden names, space-separated (empty: all in tests/golden/)'
        required: false
permissions:
  contents: read
jobs:
  render:
    name: goldens render (not required)
    # Not on main: the cache this job saves would land in main's scope, where every PR and tag run restores from
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64-asan  # the smoke job's: restores main's cache, saves only in this branch's scope
      - name: Extra packages
        run: sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: cmake --preset linux-x64-asan
      - run: cmake --build --preset linux-x64-asan --target bv2
      - name: Regenerate, then compare each new golden 3 times
        id: regen
        shell: bash
        env:
          NAMES: ${{ inputs.names }}
          ASAN_OPTIONS: detect_leaks=0
        run: |
          names=$NAMES
          [ -n "$names" ] || names=$(cd tests/golden && ls *.txt | sed 's/\.txt$//')
          for n in $names; do
            [[ $n =~ ^[a-z0-9-]+$ && -f tests/golden/$n.txt ]] || { echo "::error::no golden script tests/golden/$n.txt"; exit 1; }
          done
          before="$RUNNER_TEMP/before" after="$RUNNER_TEMP/after" shots="$RUNNER_TEMP/shots"
          mkdir -p "$before" "$after" "$RUNNER_TEMP/commit/tests/golden"
          cp tests/golden/*.png "$before/"
          exe="$PWD/build/linux-x64-asan/runtime/bv2"
          for n in $names; do
            python3 -B tests/screenshots.py "$exe" "$shots" "$n" --update
            cp "tests/golden/$n.png" "$after/"
          done
          # A golden that fails its own comparison fails CI at random (docs/build/linux.md)
          unstable=
          for n in $names; do
            passes=0
            for i in 1 2 3; do python3 -B tests/screenshots.py "$exe" "$shots" "$n" > /dev/null && passes=$((passes + 1)); done
            echo "$n: $passes of 3 comparisons passed" >> "$RUNNER_TEMP/stability.txt"
            [ "$passes" = 3 ] || unstable="$unstable $n"
          done
          echo "unstable=${unstable# }" >> "$GITHUB_OUTPUT"
      - name: Report in the summary
        id: report
        shell: bash  # -eo pipefail: a crash of the tool fails the run
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          sha=$(git rev-parse HEAD)
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY"
          {
            echo "## Screenshot goldens on \`$GITHUB_REF_NAME\` at \`$sha\`"
            echo
            python3 -B tools/golden-report.py "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" "$RUNNER_TEMP/preview" \
              "$raw/$sha/tests/golden" "$raw/golden-preview/$GITHUB_RUN_ID"
            echo
            echo "### Stability"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/stability.txt"
            echo
            echo "To commit the new goldens: download the artifact \`goldens\` of this run, unzip it at the repository root on the branch (it holds \`tests/golden/<name>.png\`) and commit."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for n in $(sed -n 's/^changed=//p' "$GITHUB_OUTPUT"); do cp "$RUNNER_TEMP/after/$n.png" "$RUNNER_TEMP/commit/tests/golden/"; done
      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: ${{ runner.temp }}/commit/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: steps.report.outputs.changed != ''
        with:
          name: golden-preview
          path: ${{ runner.temp }}/preview/
      - name: Fail when a new golden is unstable
        if: steps.regen.outputs.unstable != ''
        env:
          UNSTABLE: ${{ steps.regen.outputs.unstable }}
        run: |
          echo "::error::these new goldens failed their own comparison at least once: $UNSTABLE; do not commit them"
          exit 1
  publish:
    name: goldens publish (not required)
    needs: render
    # Also after an unstable golden failed render: the images show what went wrong
    if: always() && needs.render.outputs.changed != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # pushes golden-preview only; runs no branch code
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: golden-preview
          path: preview
      - name: Push the images to golden-preview
        env:
          TOKEN: ${{ github.token }}
        run: |
          # The images come from the job that ran the branch's code: PNG files of at most 5 MB only
          for f in preview/*.png; do
            [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || { echo "::error::$f is not a PNG"; exit 1; }
            [ "$(stat -c %s "$f")" -le 5242880 ] || { echo "::error::$f is over 5 MB"; exit 1; }
          done
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q site && cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -c "$auth" fetch -q --depth 1 origin golden-preview; then git checkout -q -b golden-preview FETCH_HEAD; else git checkout -q --orphan golden-preview; fi
          mkdir "$GITHUB_RUN_ID" && cp ../preview/*.png "$GITHUB_RUN_ID/"
          git add "$GITHUB_RUN_ID" && git commit -q -m "goldens preview, run $GITHUB_RUN_ID"
          # Runs at the same time add different directories: rebase onto whoever pushed first and try again
          for attempt in 1 2 3 4 5; do
            git -c "$auth" push -q origin HEAD:golden-preview && exit 0
            git -c "$auth" fetch -q --depth 1 origin golden-preview && git rebase -q --onto FETCH_HEAD HEAD~1 || { git rebase --abort; exit 1; }
          done
          exit 1
