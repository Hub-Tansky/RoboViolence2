name: dependency-graph
# Submits the resolved vcpkg ports to GitHub's dependency graph; GitHub can't parse vcpkg.json itself.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64
      - name: Configure (vcpkg install submits the dependency snapshot)
        env:
          VCPKG_FEATURE_FLAGS: dependencygraph
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cmake --preset linux-x64
