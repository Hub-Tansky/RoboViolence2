name: flake-watch
# Nightly, Linux only: the e2e and bots tests 10 times each, to catch flaky tests before they redden a PR (ROBO-237,
# ADR 0064). A failure opens or comments on one "Flaky test: <name>" issue per test and pings the owner's phone.
on:
  schedule:
    - cron: '47 3 * * *'  # 03:47 UTC daily, after fuzz
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # a hand-started run waits for the nightly one: two runs could both open the same issue
  group: flake-watch
  cancel-in-progress: false
jobs:
  flake-watch:
    name: flake-watch (not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write  # tools/flake-issues.py
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        id: setup
        with:
          cache-key: linux-x64-asan
      - name: Extra packages
        id: packages
        run: sudo apt-get install -y xvfb libgl1-mesa-dri
      - id: configure  # also vcpkg's manifest install, which downloads port sources
        run: cmake --preset linux-x64-asan
      - run: cmake --build --preset linux-x64-asan
      - name: e2e and bots tests, 10 times each until one fails
        id: tests
        timeout-minutes: 140  # a step timeout is a failure, so the issue and ntfy steps still run (a job timeout would skip them)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build/linux-x64-asan -R '^(e2e_.*|bots)$' --repeat until-fail:10 --no-tests=error --output-on-failure
      - name: Failed tests in the job summary
        if: failure()
        run: python3 tools/ci-test-summary.py build/linux-x64-asan
      - name: One issue per flaky test
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/flake-issues.py build/linux-x64-asan
      # Same ntfy call as build.yml's notify job: the topic is a secret, so it reaches curl as config on stdin.
      # The text says which part failed, so a runner or network outage doesn't read as a flaky test.
      - name: Ping the owner
        if: failure()
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SETUP: ${{ steps.setup.outcome }}/${{ steps.packages.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret: no notification"; exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(sed 's/^[0-9]*://' build/linux-x64-asan/Testing/Temporary/LastTestsFailed.log 2>/dev/null | paste -sd, -) || true
          if [ -n "$failed" ]; then
            title="RV2 flake watch failed"; what="flaky: $failed"
          elif [ "$SETUP" != "success/success" ]; then
            title="RV2 flake watch: setup failed"; what="setup failed (runner/network), not a flaky test"
          elif [ "$CONFIGURE" != "success" ]; then
            title="RV2 flake watch: configure failed"; what="ASan configure failed (vcpkg download or CMake), not a flaky test"
          elif [ "$TESTS" = "failure" ]; then
            title="RV2 flake watch failed"; what="test step failed with no failed test listed (timeout?)"
          else
            title="RV2 flake watch: build failed"; what="ASan build failed, not a flaky test"
          fi
          printf 'url = "https://ntfy.sh/%s"\n' "$NTFY_TOPIC" |
            curl -fsS --max-time 10 -K - -H "Title: $title" -H "Click: $url" \
              -d "${GITHUB_SHA::7} $what. $url" > /dev/null
          echo "notified: $what"
