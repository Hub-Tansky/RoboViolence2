name: hygiene
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]  # review reads the PR description
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-architecture.sh
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check-hygiene.py
      - run: python3 tools/check-content-case.py
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: clang-format 23.1.5 (same pin as .pre-commit-config.yaml), ahead of the runner's apt clang-format
        run: |
          pipx install clang-format==23.1.5
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: clang-format on changed lines (ADR 0045)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          clang-format --version | grep -q 'version 23\.1\.5' || { clang-format --version; echo "format: wrong clang-format" >&2; exit 2; }
          # PR: its base. Push: the previous tip of the branch, if it is still in the history (not a new branch or force push).
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then base="$BEFORE"
          else base=origin/main; fi
          tools/check-format.sh "$base"
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tools/review.sh against the PR base (REVIEW.md section 1)
        env:
          REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          REVIEW_PR_DRAFT: ${{ github.event.pull_request.draft }}  # empty on push: treated as draft
          REVIEW_PR_HEAD: ${{ github.event.pull_request.head.sha }}  # HEAD here is the merge commit
          REVIEW_PR_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: tools/review.sh --base origin/${{ github.base_ref || 'main' }}  # pushes compare against main, so no skipped run can mask a failure
