name: containers
# Server images (Phase B step 11): build both and run the compose example on every push and PR; push to GHCR from main,
# also weekly so base-image security fixes land without a code change.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  SERVER_IMAGE: ghcr.io/hub-tansky/roboviolence2-server
  MASTER_IMAGE: ghcr.io/hub-tansky/roboviolence2-master
jobs:
  images:
    name: images (${{ matrix.runner }})
    # Native builds for both architectures; `push` and `manifest` publish them as one multi-arch tag
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One build stage, two targets: the second build reuses the first's cached layers
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: server
          load: true
          tags: ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=servers-${{ matrix.runner }}
          cache-to: type=gha,scope=servers-${{ matrix.runner }},mode=max
      - name: Build the master image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: master
          load: true
          tags: ${{ env.MASTER_IMAGE }}:latest
          cache-from: type=gha,scope=servers-${{ matrix.runner }}
      - name: Both run as a non-root user
        run: |
          for image in "$SERVER_IMAGE" "$MASTER_IMAGE"; do
            uid=$(docker run --rm --entrypoint id "$image:latest" -u)
            echo "$image: uid $uid"
            [ "$uid" != 0 ]
          done
      # The join password comes from the environment and survives the launch script: the master lists the games as
      # passworded. Both values are random throwaways for this run. BV2_PUBLIC_ADDRESS (a documentation address): both
      # servers share one public IP, as on production, and the master lists each under it (ADR 0022)
      - name: The compose example comes up healthy; the master lists both passworded servers (CTF 3333, TDM 3334)
        run: |
          set -euo pipefail
          printf 'BV2_SV_PASSWORD=%s\nBV2_ADMIN_PASS=%s\nBV2_PUBLIC_ADDRESS=203.0.113.7\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 16)" > "$RUNNER_TEMP/ci.env"
          mkdir -p packaging/docker/srv # the /deployed bind mount, owned by the runner user
          compose="docker compose -f packaging/docker/compose.example.yml --env-file $RUNNER_TEMP/ci.env"
          $compose up -d --no-build --wait --wait-timeout 120
          $compose ps
          want="[('203.0.113.7', 3333, 'CTF-Placeholder', 1), ('203.0.113.7', 3334, 'TDM-Placeholder', 1)]"
          listed=""
          for i in $(seq 1 30); do
            $compose cp master:/var/lib/bv2/web.db web.db 2>/dev/null || true
            listed=$(python3 -c "import sqlite3; print(sqlite3.connect('web.db').execute('select IP, Port, Map, Password from Games order by Port').fetchall())" 2>/dev/null || true)
            [ "$listed" = "$want" ] && break
            sleep 5
          done
          echo "listed: $listed"
          [ "$listed" = "$want" ]
      # PNS-56: the server browser pings each game port over UDP (babonet peer, game/src/CPing.cpp). A babonet peer
      # request (system interface, packet 1, TYPE_DEMAND carrying a 4-byte id) must come back as TYPE_CONFIRM
      - name: Both game servers answer the browser's UDP ping (3333, 3334)
        run: |
          python3 - <<'PY'
          import socket, struct
          for port in (3333, 3334):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.settimeout(1)
              confirmed = False
              for attempt in range(10):
                  s.sendto(struct.pack('<BIHHI', 0, 1, 2, 4, 7), ('127.0.0.1', port))
                  try:
                      data = s.recv(1024)
                  except socket.timeout:
                      continue
                  n = 0
                  while n + 9 <= len(data):
                      interface, _, type_id, size = struct.unpack_from('<BIHH', data, n)
                      confirmed |= interface == 0 and type_id == 3 and data[n + 9:n + 9 + size] == struct.pack('<I', 7)
                      n += 9 + size
                  if confirmed:
                      break
              print(port, 'confirmed' if confirmed else 'no answer')
              assert confirmed
          PY
      # Step 12: the admin API through the TLS proxy (Caddy's own CA for localhost, hence -k)
      - name: Remote status and a command over TLS
        run: |
          set -euo pipefail
          token=$(sed -n 's/^BV2_ADMIN_PASS=//p' "$RUNNER_TEMP/ci.env")
          for i in $(seq 1 30); do # Caddy issues its local certificate on first start
            code=$(curl -sk -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' https://localhost:8443/status || true)
            [ "$code" != 000 ] && break
            sleep 2
          done
          echo "wrong token: $code"
          [ "$code" = 401 ]
          curl -skf -H "Authorization: Bearer $token" https://localhost:8443/status | tee status.txt
          grep -q '^map ' status.txt
          curl -skf -H "Authorization: Bearer $token" --data 'info' https://localhost:8443/command | tee info.txt
          grep -q 'Server Info' info.txt
          curl -skf -H "Authorization: Bearer $token" https://localhost:8443/tdm/status | tee tdm-status.txt
          grep -qx 'game type 1' tdm-status.txt
      # Phase T step 2: the staging deploy agent publishes the running commit at /deployed
      - name: /deployed serves the published commit
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA ci" > packaging/docker/srv/deployed # created before `up`, as deploy.sh does
          curl -skf https://localhost:8443/deployed | tee deployed.txt
          grep -q "^$GITHUB_SHA " deployed.txt
      - name: Logs and the master's game list
        if: always()
        run: |
          compose="docker compose -f packaging/docker/compose.example.yml"
          $compose logs --no-color master | tail -40
          $compose logs --no-color server | tail -40
          $compose logs --no-color tdm | tail -40
          $compose cp master:/var/lib/bv2/web.db web.db && python3 -c "import sqlite3; c=sqlite3.connect('web.db'); print([r for r in c.execute('select * from Games')])" || true
  push:
    name: push (${{ matrix.arch }})
    needs: images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilt from the images job's cache for this runner: no compile. One tag per architecture; `manifest` joins them
      - name: Push the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: server
          push: true
          tags: ${{ env.SERVER_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=servers-${{ matrix.runner }}
      - name: Push the master image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: master
          push: true
          tags: ${{ env.MASTER_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=servers-${{ matrix.runner }}
  # Multi-arch :<sha> and :latest (Phase T step 2): the staging host may be amd64 or arm64
  manifest:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures into one tag per commit, and latest
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE" "$MASTER_IMAGE"; do
            docker buildx imagetools create -t "$image:$GITHUB_SHA" -t "$image:latest" "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
            docker buildx imagetools inspect "$image:$GITHUB_SHA"
          done
