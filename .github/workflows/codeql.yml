name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpp:
    name: codeql (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64
      - name: Configure (outside the trace, so vcpkg ports aren't analysed)
        run: cmake --preset linux-x64
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build bv2, bv2dedicated, bv2master
        run: cmake --build --preset linux-x64 --target bv2 bv2dedicated bv2master
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          output: sarif-results
          upload: failure-only
      # Third-party headers under build/ (vcpkg_installed, e.g. miniaudio.h) are compiled into our
      # targets; their alerts aren't ours to fix, so drop them before upload.
      - uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            +**
            -build/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
          category: /language:c-cpp
  actions:
    name: codeql (actions)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
