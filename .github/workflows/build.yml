name: build
on:
  push:
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, preset: win-x64-msvc }  # pinned (PNS-27): ADR 0012 names this image
          - { os: macos-15, preset: macos-arm64 }
          - { os: ubuntu-24.04, preset: linux-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.os }}-${{ matrix.preset }}  # image in the key: a new image (new compiler) must not exact-hit a cache it cannot use
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build (keep going, so one run lists every failure)
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      # The packages are Release: fullscreen by default, no debug C++ runtime.
      - name: Configure, build and test Release
        run: |
          cmake --preset ${{ matrix.preset }}-release
          cmake --build --preset ${{ matrix.preset }}-release -- -k 0
          ctest --test-dir build/${{ matrix.preset }}-release --output-on-failure
      # Screenshot regression (T7, ADR 0026): the frame and diff of each failed screenshot_* test, Debug and Release
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Linux'
        with:
          name: screenshots-${{ matrix.preset }}
          path: build/*/test-scratch/screenshots/*.png
          if-no-files-found: ignore
      # dmgbuild lays out the disk image window (ADR 0030); a venv, since the runner's Python is externally managed
      - name: dmgbuild
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes -r packaging/macos/requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      # The archive on every OS, plus the installer (Windows), disk image (macOS) or .deb (Linux); ADR 0020, 0031
      - name: Package
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} packaging/make-package.py build/${{ matrix.preset }}-release/runtime ${{ matrix.preset }} out "$VERSION"
      # Install, upgrade over it (the master's databases stay), uninstall (they stay too); ADR 0020
      - name: The installer installs, upgrades and uninstalls silently
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"  # pass /VERYSILENT etc. through unchanged
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/rv2-install"
          setup() { ./out/roboviolence2-${{ matrix.preset }}-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$(cygpath -m "$dir")"; }
          setup
          ls "$dir/bv2.exe" "$dir/bv2dedicated.exe" "$dir/main/languages/en.lang" "$dir/licenses/sqlite3.txt" "$dir/master.db" > /dev/null
          echo kept >> "$dir/master.db"
          setup
          tail -c 5 "$dir/master.db" | grep -q kept
          "$dir/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for i in $(seq 1 30); do [ -f "$dir/bv2.exe" ] || break; sleep 1; done
          [ ! -f "$dir/bv2.exe" ]
          ls "$dir/master.db" "$dir/web.db" > /dev/null
      # archive: false uploads each file as-is (no zip around the zip); the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/roboviolence2-${{ matrix.preset }}.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/roboviolence2-${{ matrix.preset }}${{ runner.os == 'Windows' && '-setup.exe' || runner.os == 'macOS' && '.dmg' || '.deb' }}
          archive: false
  # A v* tag publishes the installers, the macOS and Linux packages and the source as a GitHub release (ADR 0020;
  # the macOS .zip carries the servers, which the .dmg leaves out, ADR 0030; the .deb, ADR 0031)
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: roboviolence2-*
          merge-multiple: true
      - name: Source tarball and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix="roboviolence2-${GITHUB_REF_NAME}/" -o "dist/roboviolence2-${GITHUB_REF_NAME}-source.tar.gz" HEAD
          # v0.* and v*-<suffix> tags are pre-releases
          pre=$([[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          echo "PRERELEASE_FLAG=$pre" >> "$GITHUB_ENV"
          # Asset names are read by Hub-Tansky/rv2-website (site.js, install.html; ADR 0036) and packaging/discord_release_post.py
          gh release create "$GITHUB_REF_NAME" --title "Robo Violence 2 $GITHUB_REF_NAME" --generate-notes $pre \
            dist/roboviolence2-win-x64-msvc-setup.exe dist/roboviolence2-macos-arm64.dmg \
            dist/roboviolence2-macos-arm64.zip dist/roboviolence2-linux-x64.tar.gz dist/roboviolence2-linux-x64.deb \
            "dist/roboviolence2-${GITHUB_REF_NAME}-source.tar.gz"
      # The post in Discord #announcements, pinging the opt-in release-ping role (ADR 0032); the owner clicks Publish
      - name: Discord release post
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_RELEASE_WEBHOOK secret: no Discord post"; exit 0; fi
          python3 -I packaging/discord_release_post.py "$GITHUB_REF_NAME" $PRERELEASE_FLAG --role "$DISCORD_ROLE_ID" \
            > "$RUNNER_TEMP/discord.json"
          curl -fsS -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK" -o /dev/null
  package-check:
    name: package-check (clean ubuntu:24.04)
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: roboviolence2-linux-x64.tar.gz
      - name: Install only the documented runtime packages
        shell: bash
        run: |
          pkgs=$(tools/setup-dev.sh --linux-runtime-packages)
          grep -qF "sudo apt install $pkgs" docs/build/linux.md || { echo "docs/build/linux.md must list: sudo apt install $pkgs"; exit 1; }
          apt-get update
          apt-get install -y --no-install-recommends $pkgs
      - name: Every library resolves; server and master start from the package
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf roboviolence2-linux-x64.tar.gz
          cd roboviolence2-linux-x64
          if ldd bv2 bv2dedicated bv2master | grep "not found"; then exit 1; fi
          ls LICENSE.txt licenses/sqlite3.txt licenses/glad.txt > /dev/null
          export BV2_PREF_DIR="$RUNNER_TEMP/pref"
          printf 'quit\n' | ./run-server.sh > server.log 2>&1   # pipefail: the server's exit code counts
          grep "Server Created on port 3333" server.log           # printed after data root, launch script, map and network init
          ./run-master.sh & pid=$!
          for i in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/10207) 2>/dev/null && break; sleep 0.5; done
          (exec 3<>/dev/tcp/127.0.0.1/10207)                      # master listens on 10207
          kill "$pid"
  # The .deb on the distributions ADR 0031 names: apt resolves its Depends in a clean image, a non-root player starts
  # the server from the read-only install, and removing it leaves nothing behind
  deb-check:
    name: deb-check (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:13]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: roboviolence2-linux-x64.deb
      - name: Install, start the server, remove
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ./roboviolence2-linux-x64.deb
          if ldd /usr/games/bv2 /usr/games/bv2dedicated | grep "not found"; then exit 1; fi
          # Only copyright from /usr/share/doc: the Docker images tell dpkg to skip the rest (ctest make_deb checks it)
          ls /usr/lib/x86_64-linux-gnu/libGL.so.1 /usr/share/bv2/main/LaunchScript/CTF.cfg \
            /usr/share/applications/roboviolence2.desktop /usr/share/icons/hicolor/128x128/apps/roboviolence2.png \
            /usr/share/doc/roboviolence2/copyright > /dev/null
          useradd -m player
          printf 'quit\n' | runuser -u player -- /usr/games/bv2dedicated CTF > server.log 2>&1
          grep "Server Created on port 3333" server.log
          apt-get remove -y roboviolence2
          for f in /usr/games/bv2 /usr/games/bv2dedicated /usr/share/bv2; do [ ! -e "$f" ] || { echo "$f left behind"; exit 1; }; done
  # Phase T step 3: the Windows and macOS packages start. Not required until 10 consecutive green runs on main.
  package-smoke:
    name: package-smoke (${{ matrix.preset }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, preset: win-x64-msvc }
          - { os: macos-15, preset: macos-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: roboviolence2-${{ matrix.preset }}.zip
          skip-decompress: true  # extract it ourselves: unzip in the action drops exec bits and bundle symlinks
      - name: Extract
        run: |
          zip=roboviolence2-${{ matrix.preset }}.zip
          if [ "$RUNNER_OS" = Windows ]; then 7z x -bd "$zip" > /dev/null; else ditto -x -k "$zip" .; fi
      # The runner has no OpenGL driver: Mesa's software renderer, loaded from the application folder
      - name: Mesa llvmpipe next to bv2.exe
        if: runner.os == 'Windows'
        env:
          MESA: 26.0.3
          MESA_SHA256: de1ec45c906164de2c046288a8969e83cf2d51d031dc8dfd1f9371bb31cd6755  # first download, 2026-10-17
        run: |
          curl -fsSLo mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA/mesa3d-$MESA-release-msvc.7z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -bd -omesa mesa.7z x64 > /dev/null
          cp mesa/x64/*.dll roboviolence2-${{ matrix.preset }}/
          echo GALLIUM_DRIVER=llvmpipe >> "$GITHUB_ENV"
      - name: Server and master start from the package
        working-directory: roboviolence2-${{ matrix.preset }}
        env:
          MSYS_NO_PATHCONV: "1"  # Git Bash would turn cmd's /c and taskkill's /F into paths
        run: |
          set -euo pipefail
          export BV2_PREF_DIR="$RUNNER_TEMP/pref-server"
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'quit\n' | cmd /c run-server.cmd > server.log 2>&1
            cmd /c run-master.cmd &   # $! would be cmd's pid, not bv2master's: stopped by name below
          else
            printf 'quit\n' | ./run-server.sh > server.log 2>&1
            ./run-master.sh & pid=$!
          fi
          cat server.log
          grep "Server Created on port 3333" server.log
          for i in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/10207) 2>/dev/null && break; sleep 0.5; done
          (exec 3<>/dev/tcp/127.0.0.1/10207)                      # master listens on 10207
          if [ "$RUNNER_OS" = Windows ]; then taskkill /F /IM bv2master.exe; else kill "$pid"; fi
      - name: Client starts and survives 10 s
        working-directory: roboviolence2-${{ matrix.preset }}
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          tmp=$RUNNER_TEMP   # Windows: cygpath -m gives D:/a/_temp, one path form for Git Bash and bv2.exe
          # run-client.cmd detaches (start ""), so its pid can't be tracked: start bv2.exe directly
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -m "$tmp"); client=./bv2.exe; else client=./run-client.sh; fi
          export BV2_PREF_DIR="$tmp/pref-client"
          printf 'r_fullScreen false\n' > "$tmp/smoke.cfg"   # runners have no display mode to switch to
          "$client" --placeholders --config "$tmp/smoke.cfg" > client.log 2>&1 & pid=$!
          sleep 10
          kill -0 "$pid" 2>/dev/null || { rc=0; wait "$pid" || rc=$?; cat client.log; echo "client exited early with $rc"; exit 1; }
          kill "$pid"
          cat client.log
          # An init failure blocks in a message box; the console (console.log) exists only after init succeeded
          ls -l "$BV2_PREF_DIR/console.log"
  smoke:
    name: smoke (linux-x64-asan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64-asan
      - name: Extra packages
        run: sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: cmake --preset linux-x64-asan
      - run: cmake --build --preset linux-x64-asan
      - name: Server smoke (loads the CTF launch script, quits) and unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build/linux-x64-asan --output-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-linux-x64-asan
          path: build/linux-x64-asan/test-scratch/screenshots/*.png
          if-no-files-found: ignore
      - name: Client reaches the main menu and survives 10 s
        working-directory: build/linux-x64-asan/runtime
        env:
          ASAN_OPTIONS: detect_leaks=0
          SDL_AUDIODRIVER: dummy
          BV2_PREF_DIR: ${{ runner.temp }}/bv2-pref
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 10 ./bv2 --placeholders
          rc=$?
          # 124 = still running when the timeout fired: it did not crash.
          [ "$rc" = 124 ] || { echo "client exited early with $rc"; exit 1; }
  fuzz:
    name: fuzz (not required)
    # Main only (owner, 2026-10-10): ~40 min, and red until steps 4-7 fix the known defects
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64-asan
      - run: cmake --preset linux-x64-asan -DBV2_BUILD_CLIENT=OFF
      - run: cmake --build --preset linux-x64-asan --target fuzz_server
      - name: Fuzz each client message type for 2 min (ASan)
        working-directory: build/linux-x64-asan/runtime
        shell: bash  # -eo pipefail: a crash fails its pipe
        env:
          ASAN_OPTIONS: detect_leaks=0
          BV2_PREF_DIR: ${{ runner.temp }}/bv2-pref
        run: |
          status=0
          for dir in ../../../tests/corpus/*/; do
            ./fuzz_server ../../../tests/corpus "$(basename "$dir")" 120 "$GITHUB_RUN_ID" "$GITHUB_WORKSPACE/fuzz-out" 2>&1 | tail -40 || status=1
          done
          exit $status
      # last.bin of a crashed type is its reproducer: add it to tests/corpus/<type>/ as crash-<name>.bin
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz-out/

  tidy:
    name: clang-tidy (not required)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-x64-tidy
      - name: Extra packages
        run: sudo apt-get install -y clang-tidy
      - run: cmake --preset linux-x64
      - name: clang-tidy over the engine libraries and the game (.clang-tidy)
        run: |
          files=$(git ls-files 'engine/*/src/*.cpp' 'game/src/*.cpp' 'masterserver/src/*.cpp' | grep -v 'third_party')
          clang-tidy -p build/linux-x64 --quiet $files 2>&1 | tee tidy.log | tail -50
          echo "findings: $(grep -c 'warning:' tidy.log)"
      - uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: tidy.log
