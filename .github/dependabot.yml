# vcpkg has no Dependabot ecosystem: its ports are bumped by hand (monthly baseline bump, see ARCHITECTURE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:  # a release is a week old before its PR opens; minor and patch PRs merge themselves (ADR ROBO-250)
      default-days: 7
  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: weekly
